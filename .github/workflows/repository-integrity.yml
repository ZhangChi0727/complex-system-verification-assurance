name: Repository integrity

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile governance checks without SyntaxWarnings
        run: python -W error::SyntaxWarning -m compileall -q scripts tests
      - name: Run negative and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run repository-governance integrity checks
        run: python scripts/check_repository_integrity.py
